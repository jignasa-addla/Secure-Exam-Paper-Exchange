<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 1530" width="1360" height="1530" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="aB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker><marker id="aG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="aR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs>
<rect width="1360" height="1530" fill="#ffffff"/>
<text x="680.0" y="34" font-size="22" font-weight="bold" fill="#1f2933" text-anchor="middle">Secure Examination-Paper Exchange - Sequence of Events</text>
<text x="680.0" y="58" font-size="13" fill="#52606d" text-anchor="middle">AES-256-GCM (confidentiality + integrity)   |   RSA-OAEP / SHA-256 (session-key protection)   |   RSA-PSS / SHA-256 (sender authentication)</text>
<line x1="230" y1="132" x2="230" y2="1516" stroke="#9aa5b1" stroke-width="2" stroke-dasharray="6 5"/>
<rect x="80" y="76" width="300" height="54" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
<text x="230" y="101.2" font-size="15" font-weight="bold" fill="#1f2933" text-anchor="middle">Faculty / Sender</text>
<text x="230" y="121.2" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">(sender app)</text>
<line x1="680" y1="132" x2="680" y2="1516" stroke="#9aa5b1" stroke-width="2" stroke-dasharray="6 5"/>
<rect x="530" y="76" width="300" height="54" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
<text x="680" y="101.2" font-size="15" font-weight="bold" fill="#1f2933" text-anchor="middle">Untrusted channel</text>
<text x="680" y="121.2" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">(attacker may read / modify / replace)</text>
<line x1="1130" y1="132" x2="1130" y2="1516" stroke="#9aa5b1" stroke-width="2" stroke-dasharray="6 5"/>
<rect x="980" y="76" width="300" height="54" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="1130" y="101.2" font-size="15" font-weight="bold" fill="#1f2933" text-anchor="middle">Exam Coordinator / Recipient</text>
<text x="1130" y="121.2" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">(recipient app)</text>
<rect x="20" y="150" width="1320" height="34" rx="5" fill="#eef2f7" stroke="#cbd2d9"/>
<text x="34" y="171.6" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="start">PHASE 0 - Setup (once)  -  public keys exchanged over a TRUSTED channel</text>
<rect x="30.0" y="192" width="400" height="54" rx="7" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.6"/>
<text x="230" y="215.6" font-size="13" font-weight="normal" fill="#1f2933" text-anchor="middle">Generate RSA-4096 key pair (S_priv, S_pub)</text>
<text x="230" y="231.6" font-size="13" font-weight="normal" fill="#1f2933" text-anchor="middle">S_priv stored encrypted (PKCS#8, 0600)</text>
<rect x="930.0" y="256" width="400" height="54" rx="7" fill="#ffffff" stroke="#1f2933" stroke-width="1.6"/>
<text x="1130" y="279.6" font-size="13" font-weight="normal" fill="#1f2933" text-anchor="middle">Generate RSA-4096 key pair (R_priv, R_pub)</text>
<text x="1130" y="295.6" font-size="13" font-weight="normal" fill="#1f2933" text-anchor="middle">R_priv stored encrypted (PKCS#8, 0600)</text>
<line x1="236" y1="356" x2="1124" y2="356" stroke="#15803d" stroke-width="2.4" stroke-dasharray="8 4" marker-end="url(#aG)"/>
<rect x="528" y="328" width="304" height="20" rx="4" fill="#ffffff"/>
<text x="680.0" y="343.6" font-size="13" font-weight="normal" fill="#15803d" text-anchor="middle">S_pub  (trusted channel, fingerprint checked)</text>
<line x1="1124" y1="414" x2="236" y2="414" stroke="#15803d" stroke-width="2.4" stroke-dasharray="8 4" marker-end="url(#aG)"/>
<rect x="528" y="386" width="304" height="20" rx="4" fill="#ffffff"/>
<text x="680.0" y="401.6" font-size="13" font-weight="normal" fill="#15803d" text-anchor="middle">R_pub  (trusted channel, fingerprint checked)</text>
<rect x="20" y="436" width="1320" height="34" rx="5" fill="#eef2f7" stroke="#cbd2d9"/>
<text x="34" y="457.6" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="start">PHASE 1 - Sender protects the examination paper</text>
<rect x="30.0" y="478" width="400" height="54" rx="7" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.6"/>
<text x="230" y="509.6" font-size="13" font-weight="normal" fill="#1f2933" text-anchor="middle">1. Read exam paper P</text>
<rect x="30.0" y="542" width="400" height="54" rx="7" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.6"/>
<text x="230" y="565.5" font-size="13" font-weight="normal" fill="#1f2933" text-anchor="middle">2. Generate FRESH AES-256 session key K</text>
<text x="230" y="581.5" font-size="13" font-weight="normal" fill="#1f2933" text-anchor="middle">and FRESH 96-bit nonce N</text>
<rect x="30.0" y="606" width="400" height="54" rx="7" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.6"/>
<text x="230" y="629.5" font-size="13" font-weight="normal" fill="#1f2933" text-anchor="middle">3. AES-256-GCM encrypt P with (K, N),</text>
<text x="230" y="645.5" font-size="13" font-weight="normal" fill="#1f2933" text-anchor="middle">AAD = metadata  -&gt;  ciphertext C + tag T</text>
<rect x="30.0" y="670" width="400" height="54" rx="7" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.6"/>
<text x="230" y="693.5" font-size="13" font-weight="normal" fill="#1f2933" text-anchor="middle">4. Wrap K with R_pub: RSA-OAEP (SHA-256)</text>
<text x="230" y="709.5" font-size="13" font-weight="normal" fill="#1f2933" text-anchor="middle">-&gt;  EK</text>
<rect x="30.0" y="734" width="400" height="54" rx="7" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.6"/>
<text x="230" y="757.5" font-size="13" font-weight="normal" fill="#1f2933" text-anchor="middle">5. Assemble package</text>
<text x="230" y="773.5" font-size="13" font-weight="normal" fill="#1f2933" text-anchor="middle">{ metadata, EK, N, C, T }</text>
<rect x="30.0" y="798" width="400" height="54" rx="7" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.6"/>
<text x="230" y="821.5" font-size="13" font-weight="normal" fill="#1f2933" text-anchor="middle">6. Sign the COMPLETE package with S_priv:</text>
<text x="230" y="837.5" font-size="13" font-weight="normal" fill="#1f2933" text-anchor="middle">RSA-PSS (SHA-256)  -&gt;  SIG</text>
<rect x="20" y="862" width="1320" height="34" rx="5" fill="#eef2f7" stroke="#cbd2d9"/>
<text x="34" y="883.5" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="start">PHASE 2 - Transfer over the untrusted channel</text>
<line x1="236" y1="940" x2="674" y2="940" stroke="#1d4ed8" stroke-width="2.4" marker-end="url(#aB)"/>
<rect x="297" y="912" width="317" height="20" rx="4" fill="#ffffff"/>
<text x="455.0" y="927.5" font-size="13" font-weight="bold" fill="#1d4ed8" text-anchor="middle">package.exampkg  { metadata, EK, N, C, T, SIG }</text>
<rect x="480.0" y="962" width="400" height="54" rx="7" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.6"/>
<text x="680" y="985.5" font-size="13" font-weight="normal" fill="#1f2933" text-anchor="middle">Attacker can READ (sees only ciphertext),</text>
<text x="680" y="1001.5" font-size="13" font-weight="normal" fill="#1f2933" text-anchor="middle">MODIFY, REPLACE or REPLAY the package</text>
<line x1="686" y1="1062" x2="1124" y2="1062" stroke="#1d4ed8" stroke-width="2.4" marker-end="url(#aB)"/>
<rect x="775" y="1034" width="259" height="20" rx="4" fill="#ffffff"/>
<text x="905.0" y="1049.5" font-size="13" font-weight="bold" fill="#1d4ed8" text-anchor="middle">package.exampkg  (genuine or tampered)</text>
<rect x="20" y="1084" width="1320" height="34" rx="5" fill="#eef2f7" stroke="#cbd2d9"/>
<text x="34" y="1105.5" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="start">PHASE 3 - Recipient verifies FIRST, decrypts only if every check passes</text>
<rect x="930.0" y="1126" width="400" height="54" rx="7" fill="#ffffff" stroke="#1f2933" stroke-width="1.6"/>
<text x="1130" y="1157.5" font-size="13" font-weight="normal" fill="#1f2933" text-anchor="middle">7. Parse package, check format / version</text>
<line x1="930.0" y1="1153.0" x2="760.0" y2="1153.0" stroke="#b91c1c" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#aR)"/>
<rect x="592.0" y="1138.0" width="164" height="30" rx="6" fill="#fee2e2" stroke="#b91c1c"/>
<text x="674.0" y="1157.2" font-size="12" font-weight="bold" fill="#b91c1c" text-anchor="middle">malformed -&gt; REJECT</text>
<rect x="930.0" y="1190" width="400" height="54" rx="7" fill="#ffffff" stroke="#1f2933" stroke-width="1.6"/>
<text x="1130" y="1213.5" font-size="13" font-weight="normal" fill="#1f2933" text-anchor="middle">8. Verify SIG with TRUSTED S_pub</text>
<text x="1130" y="1229.5" font-size="13" font-weight="normal" fill="#1f2933" text-anchor="middle">(RSA-PSS, SHA-256)</text>
<line x1="930.0" y1="1217.0" x2="760.0" y2="1217.0" stroke="#b91c1c" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#aR)"/>
<rect x="592.0" y="1202.0" width="164" height="30" rx="6" fill="#fee2e2" stroke="#b91c1c"/>
<text x="674.0" y="1221.2" font-size="12" font-weight="bold" fill="#b91c1c" text-anchor="middle">invalid -&gt; REJECT</text>
<rect x="930.0" y="1254" width="400" height="54" rx="7" fill="#ffffff" stroke="#1f2933" stroke-width="1.6"/>
<text x="1130" y="1285.5" font-size="13" font-weight="normal" fill="#1f2933" text-anchor="middle">9. Replay check (package_id ledger)</text>
<line x1="930.0" y1="1281.0" x2="760.0" y2="1281.0" stroke="#b91c1c" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#aR)"/>
<rect x="592.0" y="1266.0" width="164" height="30" rx="6" fill="#fee2e2" stroke="#b91c1c"/>
<text x="674.0" y="1285.2" font-size="12" font-weight="bold" fill="#b91c1c" text-anchor="middle">seen before -&gt; REJECT</text>
<rect x="930.0" y="1318" width="400" height="54" rx="7" fill="#ffffff" stroke="#1f2933" stroke-width="1.6"/>
<text x="1130" y="1341.5" font-size="13" font-weight="normal" fill="#1f2933" text-anchor="middle">10. Unwrap K with R_priv</text>
<text x="1130" y="1357.5" font-size="13" font-weight="normal" fill="#1f2933" text-anchor="middle">(RSA-OAEP, SHA-256)</text>
<line x1="930.0" y1="1345.0" x2="760.0" y2="1345.0" stroke="#b91c1c" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#aR)"/>
<rect x="592.0" y="1330.0" width="164" height="30" rx="6" fill="#fee2e2" stroke="#b91c1c"/>
<text x="674.0" y="1349.2" font-size="12" font-weight="bold" fill="#b91c1c" text-anchor="middle">wrong key -&gt; REJECT</text>
<rect x="930.0" y="1382" width="400" height="54" rx="7" fill="#ffffff" stroke="#1f2933" stroke-width="1.6"/>
<text x="1130" y="1405.5" font-size="13" font-weight="normal" fill="#1f2933" text-anchor="middle">11. AES-256-GCM decrypt with (K, N, AAD)</text>
<text x="1130" y="1421.5" font-size="13" font-weight="normal" fill="#1f2933" text-anchor="middle">verify tag T</text>
<line x1="930.0" y1="1409.0" x2="760.0" y2="1409.0" stroke="#b91c1c" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#aR)"/>
<rect x="592.0" y="1394.0" width="164" height="30" rx="6" fill="#fee2e2" stroke="#b91c1c"/>
<text x="674.0" y="1413.2" font-size="12" font-weight="bold" fill="#b91c1c" text-anchor="middle">tag bad -&gt; REJECT</text>
<rect x="930.0" y="1446" width="400" height="54" rx="7" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/>
<text x="1130" y="1469.5" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">12. ALL checks passed: release plaintext P</text>
<text x="1130" y="1485.5" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">to the coordinator (write to disk)</text>
</svg>